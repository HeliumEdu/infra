name: "Check ALB DNS"

run-name: "Check ALB DNS"

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: none
  pull-requests: none

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: us-east-1
  DD_API_KEY: ${{ secrets.PROJECT_DATADOG_API_KEY }}
  LB_NAME: helium-prod

concurrency:
  group: helium-check-alb-dns

jobs:
  check-alb-dns:
    name: Check ALB DNS

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Compare advertised addresses against attached interfaces
        id: check
        run: |
          set +e
          OUTPUT=$(./bin/check-alb-dns.sh "$LB_NAME" 2>&1)
          STATUS=$?
          set -e

          echo "$OUTPUT"

          DRIFT=$(echo "$OUTPUT" | sed -n 's/^drift_count=//p' | tail -1)
          echo "drift=${DRIFT:-}" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Report drift to Datadog
        if: always() && steps.check.outputs.drift != ''
        env:
          DRIFT: ${{ steps.check.outputs.drift }}
        run: |
          curl -sS -X POST "https://api.datadoghq.com/api/v2/series" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${DD_API_KEY}" \
            -d "$(jq -n --argjson value "$DRIFT" --arg ts "$(date +%s)" '
              {
                series: [{
                  metric: "helium.alb.dns_drift",
                  type: 3,
                  points: [{ timestamp: ($ts | tonumber), value: $value }],
                  tags: ["env:prod"]
                }]
              }')" \
            --fail-with-body

      - name: Fail when addresses disagree
        if: steps.check.outputs.status != '0'
        run: |
          echo "Advertised addresses and attached interfaces disagree."
          exit 1
