name: "Check ALB DNS"

run-name: "Check ALB DNS"

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: none
  pull-requests: none

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: us-east-1
  LB_NAME: helium-prod

concurrency:
  group: helium-check-alb-dns

jobs:
  check-alb-dns:
    name: Check ALB DNS

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Compare advertised addresses against attached interfaces
        id: check
        run: |
          set +e
          OUTPUT=$(./bin/check-alb-dns.sh "$LB_NAME" 2>&1)
          STATUS=$?
          set -e

          echo "$OUTPUT"

          ORPHANED=$(echo "$OUTPUT" | sed -n 's/^orphaned_count=//p' | tail -1)
          UNADVERTISED=$(echo "$OUTPUT" | sed -n 's/^unadvertised_count=//p' | tail -1)
          {
            echo "orphaned=${ORPHANED:-}"
            echo "unadvertised=${UNADVERTISED:-}"
            echo "status=$STATUS"
          } >> "$GITHUB_OUTPUT"

      - name: Report orphaned addresses to Datadog
        if: always() && steps.check.outputs.orphaned != ''
        uses: HeliumEdu/.github/actions/datadog-metric@main
        with:
          api-key: ${{ secrets.PROJECT_DATADOG_API_KEY }}
          metric: helium.alb.dns_drift
          value: ${{ steps.check.outputs.orphaned }}
          tags: env:prod,kind:orphaned

      - name: Report unadvertised nodes to Datadog
        if: always() && steps.check.outputs.unadvertised != ''
        uses: HeliumEdu/.github/actions/datadog-metric@main
        with:
          api-key: ${{ secrets.PROJECT_DATADOG_API_KEY }}
          metric: helium.alb.dns_drift
          value: ${{ steps.check.outputs.unadvertised }}
          tags: env:prod,kind:unadvertised

      - name: Fail when the check does not pass
        if: steps.check.outputs.status != '0'
        run: |
          echo "The check exited ${{ steps.check.outputs.status }}; its output above has the detail."
          exit 1
