name: "Prune AWS Artifacts"

run-name: "Prune AWS Artifacts"

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: none
  pull-requests: none

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: us-east-1
  KEEP_COUNT: 20

concurrency:
  group: helium-prune-aws-artifacts

jobs:
  prune-ecr:
    name: Prune ECR (${{ matrix.repository }})

    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        repository:
          - helium/frontend-web
          - helium/platform-resource
          - helium/platform-api
          - helium/platform-worker

    steps:
      - name: Prune old images
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          IMAGES=$(aws ecr-public describe-images \
            --repository-name "$REPOSITORY" \
            --query 'imageDetails | sort_by(@, &imagePushedAt) | reverse(@)' \
            --output json)

          TOTAL=$(echo "$IMAGES" | jq length)
          echo "Total images in $REPOSITORY: $TOTAL"

          if [ "$TOTAL" -le "$KEEP_COUNT" ]; then
            echo "Within retention limit ($KEEP_COUNT), nothing to prune."
            exit 0
          fi

          DIGESTS=$(echo "$IMAGES" | jq -r --argjson keep "$KEEP_COUNT" '
            .[($keep):] |
            map(select((.imageTags // []) | all(endswith("-latest") | not))) |
            .[].imageDigest')

          if [ -z "$DIGESTS" ]; then
            echo "No images eligible for pruning (remaining images have latest tags)."
            exit 0
          fi

          DELETE_COUNT=$(echo "$DIGESTS" | wc -l | tr -d ' ')
          echo "Pruning $DELETE_COUNT images from $REPOSITORY:"
          echo "$IMAGES" | jq -r --argjson keep "$KEEP_COUNT" '
            .[($keep):] |
            map(select((.imageTags // []) | all(endswith("-latest") | not))) |
            .[] | "  \(.imageTags // ["<untagged>"] | join(", ")) (pushed \(.imagePushedAt))"'

          echo "$DIGESTS" | jq -R '{"imageDigest": .}' | jq -s -c \
            'range(0; length; 100) as $i | .[$i:$i+100]' | \
            while IFS= read -r batch; do
              aws ecr-public batch-delete-image \
                --repository-name "$REPOSITORY" \
                --image-ids "$batch"
            done

  prune-connector:
    name: Prune S3 (connector)

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Prune old Lambda packages
        run: |
          PREFIX="helium/connector/"
          PINNED=$(sed -n '/variable "connector_version"/,/}/s/.*default *= *"\(.*\)".*/\1/p' terraform/environments/prod/variables.tf)
          if [ -z "$PINNED" ]; then
            echo "Couldn't read prod's connector_version; refusing to prune."
            exit 1
          fi
          echo "Prod runs connector $PINNED; its package is always kept."

          KEYS=$(aws s3api list-objects-v2 \
            --bucket heliumedu \
            --prefix "$PREFIX" \
            --query 'sort_by(Contents, &LastModified)[].Key' \
            --output json | jq -r '.[]' | grep -vx "${PREFIX}connector-${PINNED}.zip")

          TOTAL=$(echo "$KEYS" | grep -c . || true)
          echo "Packages in s3://heliumedu/${PREFIX} besides prod's: $TOTAL"

          if [ "$TOTAL" -lt "$KEEP_COUNT" ]; then
            echo "Within retention limit ($KEEP_COUNT), nothing to prune."
            exit 0
          fi

          echo "$KEYS" | head -n $((TOTAL - KEEP_COUNT + 1)) | while IFS= read -r key; do
            echo "  Deleting s3://heliumedu/${key}"
            aws s3 rm "s3://heliumedu/${key}"
          done
